_target_: pretrain_strategy.sim_clr_pretrain.SimCLRPretraining
_partial_: True

projection_dimension: 128
contrastive_head:
  _target_: networks.MLP.MLP
  input_dimension: 512
  layer_sizes: [512, 128]
  hidden_activation_name: relu
  output_activation_name: identity

base_transform:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.RandomResizedCrop
      size: [224, 224]
      scale: [0.4, 1.0]
    - _target_: torchvision.transforms.v2.RandomApply
      p: 0.8
      transforms:
        - _target_: torchvision.transforms.v2.ColorJitter
          brightness: [ 0.6, 1.4 ]
          contrast: [ 0.6, 1.4 ]
          saturation: [ 0.6, 1.4 ]
          hue: [ -0.1, 0.1 ]
    - _target_: torchvision.transforms.v2.RandomGrayscale
      p: 0.2
    - _target_: torchvision.transforms.v2.RandomHorizontalFlip
      p: 0.5
    - _target_: torchvision.transforms.v2.ToDtype
      dtype: ${torch_dtype:"float32"}
      scale: True
    - _target_: torchvision.transforms.v2.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

augment_transform:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.RandomResizedCrop
      size: [224, 224]
      scale: [0.4, 1.0]
    - _target_: torchvision.transforms.v2.RandomApply
      p: 0.8
      transforms:
        - _target_: torchvision.transforms.v2.ColorJitter
          brightness: [ 0.6, 1.4 ]
          contrast: [ 0.6, 1.4 ]
          saturation: [ 0.6, 1.4 ]
          hue: [ -0.1, 0.1 ]
    - _target_: torchvision.transforms.v2.RandomGrayscale
      p: 0.2
    - _target_: torchvision.transforms.v2.RandomHorizontalFlip
      p: 0.5
    - _target_: torchvision.transforms.v2.ToDtype
      dtype: ${torch_dtype:"float32"}
      scale: True
    - _target_: torchvision.transforms.v2.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

test_train_transform:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.ToDtype
      dtype: ${torch_dtype:"float32"}
      scale: True
    - _target_: torchvision.transforms.v2.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

temperature: 0.1
optimizer:
  _target_: torch.optim.SGD
  _partial_: True
  lr: 0.1
  nesterov: False
  weight_decay: 0.0001
  momentum: 0.9

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR # Decline in an cosine fashion ...
  _partial_: True
  eta_min: 1e-4
  T_max: 500