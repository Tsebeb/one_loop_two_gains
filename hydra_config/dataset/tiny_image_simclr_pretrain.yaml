defaults:
  - _self_

augmentations:
  train:
    to_image:
      _target_: torchvision.transforms.v2.ToImage

  test:
    to_dtype:
      _target_: torchvision.transforms.v2.ToDtype
      dtype : ${torch_dtype:"float32"}
      scale: True

    normalize:
      _target_: torchvision.transforms.v2.Normalize
      mean: [ 0.485, 0.456, 0.406 ]
      std: [ 0.229, 0.224, 0.225 ]


name: "tiny-imagenet"
num_classes: 200
image_width: 64
image_height: 64
image_channels: 3
val_split: 0.0