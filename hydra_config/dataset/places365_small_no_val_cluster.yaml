defaults:
  - _self_

augmentations:
  train:
    to_image:
      _target_: torchvision.transforms.v2.ToImage

    to_dtype:
      _target_: torchvision.transforms.v2.ToDtype
      dtype : ${torch_dtype:"float32"}
      scale: True

    crop:
      _target_: torchvision.transforms.v2.RandomCrop
      size: 224

    hflip:
      _target_: torchvision.transforms.v2.RandomHorizontalFlip
      p: 0.5

    vflip:
      _target_: torchvision.transforms.v2.RandomVerticalFlip
      p: 0.5

    color_jitter:
      _target_: torchvision.transforms.v2.ColorJitter
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4

    normalize:
      _target_: torchvision.transforms.v2.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  test:
    to_image:
      _target_: torchvision.transforms.v2.ToImage

    to_dtype:
      _target_: torchvision.transforms.v2.ToDtype
      dtype: ${torch_dtype:"float32"}
      scale: True

    center_crop:
      _target_: torchvision.transforms.v2.CenterCrop
      size: 224

    normalize:
      _target_: torchvision.transforms.v2.Normalize
      mean: [ 0.485, 0.456, 0.406 ]
      std: [ 0.229, 0.224, 0.225 ]


data_path: /media/data/projects/datasets/places365/small_version
name: "places_small_365"
num_classes: 365
image_width: 224
image_height: 224
image_channels: 3
val_split: 0.0