defaults:
  - _self_

augmentations:
  train:
    to_image:
      _target_: torchvision.transforms.v2.ToImage
    resize:
      _target_: torchvision.transforms.v2.Resize
      size: [224, 224]
    # Remaining Augmentations are part of the Pretrain method as we need two augmentations from the same sample ...
  test:
    to_image:
      _target_: torchvision.transforms.v2.ToImage

    to_dtype:
      _target_: torchvision.transforms.v2.ToDtype
      dtype: ${torch_dtype:"float32"}
      scale: True

    resize:
      _target_: torchvision.transforms.v2.Resize
      size: [224, 224]

    normalize:
      _target_: torchvision.transforms.v2.Normalize
      mean: [ 0.485, 0.456, 0.406 ]
      std: [ 0.229, 0.224, 0.225 ]


name: "imagewoof"
num_classes: 10
image_width: 224
image_height: 224
image_channels: 3
val_split: 0.0